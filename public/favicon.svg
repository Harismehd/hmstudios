<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d37" />
      <stop offset="100%" stop-color="#050e1a" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00" />
      <stop offset="60%" stop-color="#ff8f00" />
      <stop offset="100%" stop-color="#ffc400" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg-grad)" />
  
  <!-- HM Arrow Symbol -->
  <g transform="translate(10, 10)">
    <!-- Left vertical bar of H -->
    <rect x="150" y="190" width="40" height="150" rx="20" fill="url(#logo-grad)" />
    <!-- Circle node on top of left bar -->
    <circle cx="170" cy="150" r="25" fill="url(#logo-grad)" />
    
    <!-- Diagonal connector & Middle valley -->
    <path d="M 180 260 
             L 240 180 
             C 250 170, 260 170, 265 180 
             L 300 240 
             L 320 210 
             C 325 200, 335 200, 340 210
             L 390 300
             C 395 310, 390 320, 380 320
             L 330 320
             C 320 320, 315 310, 320 300
             L 345 255
             L 310 305
             C 305 315, 295 315, 290 305
             L 240 220
             L 190 285
             Z" fill="url(#logo-grad)" />
             
    <!-- Right arrow shaft & arrowhead pointing up-right -->
    <path d="M 280 320
             L 380 180
             L 330 180
             C 320 180, 315 170, 320 160
             L 330 145
             C 335 135, 345 135, 350 145
             L 410 225
             C 415 235, 410 245, 400 245
             L 385 245
             C 375 245, 370 235, 375 225
             L 385 210
             L 300 330
             C 295 340, 285 340, 280 330
             Z" fill="url(#logo-grad)" />
  </g>
</svg>
